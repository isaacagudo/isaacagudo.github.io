name: Import UMA project pages

on:
  push:
    branches: [data-import]
    paths:
      - .github/workflows/uma-projects.yml
      - scripts/uma_projects.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the founders' project pages from the UMA research portal
        run: python3 scripts/uma_projects.py
      - name: Commit the raw pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _import/uma
          git commit -m "Import UMA project pages" || echo "No changes"
          git pull --rebase
          git push
